---
- name: Include dotfiles configuration
  include_tasks: dotfiles.yml

- name: Include vim configuration
  include_tasks: vim.yml
  
- name: Ensure required OS packages are installed
  apt:
    name: python3-pip, python3-venv, pipx
    state: present
  become: yes

- name: Ensure global python packages for pipx are installed
  command:
    cmd: pipx install {{ item }}
    creates: ~/.local/bin/{{ item }}
  with_items: "{{ global_python_packages }}"

- name: Ensure ~/.local/bin is on the path (required for pipx installed tools)
  lineinfile:
    path: ~/.bashrc
    regexp: '^export PATH=~/\.local/bin'
    line: 'export PATH=~/.local/bin:$PATH'

